name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar assinatura
        env:
          ASSINATURA_KEYSTORE: ${{ secrets.ASSINATURA_KEYSTORE }}
        run: |
          if [ -z "$ASSINATURA_KEYSTORE" ]; then
            echo "::error::Segredo ASSINATURA_KEYSTORE não configurado (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$ASSINATURA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/assinatura.keystore"
          echo "ASSINATURA_ARQUIVO=$RUNNER_TEMP/assinatura.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-flutuante-apk
          path: app/build/outputs/apk/debug/app-debug.apk
